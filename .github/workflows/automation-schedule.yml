# Triggers the deployed Next.js route that runs your automation (Bearer CRON_SECRET).
# Vercel Cron is NOT used for this job (only /api/heartbeat stays on Vercel).
#
# --- GitHub Actions secrets (Repo → Settings → Secrets and variables → Actions) ---
#
# AUTOMATIONS_URL
#   Production URL, e.g. https://YOUR_DOMAIN/api/cron/automations/run
#
# CRON_SECRET
#   Must match the Production env var CRON_SECRET on Vercel (same as heartbeat checks).
#
# --- Rollout ---
# 1) Set secrets, push this file, deploy Vercel.
# 2) Actions → "Automation schedule" → Run workflow (workflow_dispatch) → should succeed.
# 3) Confirm a row in /automations Task history.
# 4) Schedule below runs every 15 minutes (UTC). Switch to */5 * * * * only if you accept the load.
#
name: Automation schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: automation-cron-${{ github.ref }}
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger /api/cron/automations/run
        env:
          AUTOMATIONS_URL: ${{ secrets.AUTOMATIONS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${AUTOMATIONS_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::Set GitHub Actions secrets AUTOMATIONS_URL and CRON_SECRET (see workflow header comment)."
            exit 1
          fi
          curl -fsS "$AUTOMATIONS_URL" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            -H "User-Agent: github-actions-automation-cron"
